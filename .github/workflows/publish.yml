name: Publish NuGet Packages

on:
  push:
    branches:
      - main

# id-token: write  — required for NuGet Trusted Publishing via OIDC (no API keys needed)
# contents: write  — required to create git tags and GitHub Releases
permissions:
  id-token: write
  contents: write

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # 1. Read version from csproj file and check whether it is already on NuGet
  # ────────────────────────────────────────────────────────────────────────────
  read-version:
    name: Read Version & Check NuGet
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
      published: ${{ steps.check.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: read
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' MathTrigonometric/MathTrigonometric.csproj | tr -d '[:space:]')
          if [ -z "$VERSION" ]; then
            echo "::error::<Version> not found in MathTrigonometric/MathTrigonometric.csproj"
            exit 1
          fi

          echo "MathTrigonometric version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if MathTrigonometric ${{ steps.read.outputs.version }} is already published
        id: check
        env:
          VERSION: ${{ steps.read.outputs.version }}
        run: |
          # NuGet package ids and versions are lower-case in the flat container API
          ID=mathtrigonometric
          VER=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://api.nuget.org/v3-flatcontainer/${ID}/${VER}/${ID}.${VER}.nupkg")

          case "$HTTP_STATUS" in
            200)
              echo "::notice::MathTrigonometric $VERSION is already published — publishing will be skipped."
              echo "published=true" >> $GITHUB_OUTPUT ;;
            404)
              echo "MathTrigonometric $VERSION is not yet published."
              echo "published=false" >> $GITHUB_OUTPUT ;;
            *)
              echo "::error::Unexpected HTTP status $HTTP_STATUS from NuGet; cannot tell whether $VERSION is published."
              exit 1 ;;
          esac

  # ────────────────────────────────────────────────────────────────────────────
  # 2. Run tests on every push — publishing is blocked if any test fails
  #    The test project targets net8.0, net9.0, net10.0 and net11.0, so all four runtimes are installed.
  # ────────────────────────────────────────────────────────────────────────────
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.x
            9.x
            10.x
            11.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --configuration Release --no-build

  # ────────────────────────────────────────────────────────────────────────────
  # 3. Build, pack and publish MathTrigonometric
  #    Skipped entirely when this version is already on NuGet.
  # ────────────────────────────────────────────────────────────────────────────
  publish-mathtrigonometric:
    name: Publish MathTrigonometric
    needs: [read-version, run-tests]
    if: needs.read-version.outputs.published == 'false'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.x'

      - name: Build MathTrigonometric
        run: dotnet build MathTrigonometric/MathTrigonometric.csproj -c Release

      - name: Pack MathTrigonometric
        run: dotnet pack MathTrigonometric/MathTrigonometric.csproj -c Release -o ./nupkgs --no-build

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish MathTrigonometric to NuGet (Trusted Publishing)
        id: publish
        env:
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          dotnet nuget push "./nupkgs/MathTrigonometric.${VERSION}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          echo "published=true" >> $GITHUB_OUTPUT

  # ────────────────────────────────────────────────────────────────────────────
  # 4. Tag the commit and create a GitHub Release with auto-generated notes
  #    Runs only when MathTrigonometric was newly published in this workflow run
  # ────────────────────────────────────────────────────────────────────────────
  create-release:
    name: Tag & Create GitHub Release
    needs: [read-version, publish-mathtrigonometric]
    if: needs.publish-mathtrigonometric.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so GitHub can generate meaningful release notes

      - name: Create tag v${{ needs.read-version.outputs.version }} and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.read-version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            --latest
